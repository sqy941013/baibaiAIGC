# Deai (降AIGC) service — drop-in Docker Compose configuration.
#
# Usage:
#   docker compose -f docker-compose.deai.yml up -d
#
# Or merge into an existing docker-compose.yml by copying the `services.deai` block.
#
# The service exposes port 8000 and provides:
#   GET  /health              — health check
#   POST /api/deai/process    — run the deai pipeline on text/Markdown input

services:
  deai:
    build:
      context: .
      dockerfile: Dockerfile.deai
    container_name: deai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # LLM API configuration. Two ways to drive it:
      #
      # 1. Pre-configure the container with its own provider via env vars.
      #    When all three of api_key / model / base_url are set, the
      #    deai service uses them exclusively and IGNORES any credentials
      #    forwarded in the request body. Recommended when the deai
      #    service should run on a dedicated provider (e.g. Minimax
      #    Coding Plan) independent of the upstream caller.
      #
      #    Minimax (OpenAI-compatible) example:
      #      MINIMAX_API_KEY: "${MINIMAX_API_KEY:-}"
      #      MINIMAX_MODEL: "${MINIMAX_MODEL:-MiniMax-M2.7-highspeed}"
      #      MINIMAX_BASE_URL: "${MINIMAX_BASE_URL:-https://api.minimaxi.com/v1}"
      #
      #    Generic / legacy variable names (still supported):
      #      BAIBAIAIGC_API_KEY: "${DEAI_API_KEY:-}"
      #      BAIBAIAIGC_MODEL: "${DEAI_MODEL:-}"
      #      BAIBAIAIGC_BASE_URL: "${DEAI_BASE_URL:-}"
      #
      # 2. Leave env vars empty and pass api_key / model / base_url
      #    per request in the JSON body — useful when the caller wants
      #    polish to share the upstream service's active LLM profile.
      PORT: "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
