# Deai (降AIGC) service — drop-in Docker Compose configuration.
#
# Usage:
#   docker compose -f docker-compose.deai.yml up -d
#
# Or merge into an existing docker-compose.yml by copying the `services.deai` block.
#
# The service exposes port 8000 and provides:
#   GET  /health              — health check
#   POST /api/deai/process    — run the deai pipeline on text/Markdown input

services:
  deai:
    build:
      context: .
      dockerfile: Dockerfile.deai
    container_name: deai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # LLM API configuration — Minimax Coding Plan credentials
      MINIMAX_API_KEY: "${MINIMAX_API_KEY:-}"
      MINIMAX_MODEL: "${MINIMAX_MODEL:-MiniMax-M2.7-highspeed}"
      MINIMAX_BASE_URL: "${MINIMAX_BASE_URL:-https://api.minimaxi.com/v1}"
      PORT: "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
